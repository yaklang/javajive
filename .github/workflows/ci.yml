# Keep required PR feedback fast and attributable: one pinned JDK 21 runtime,
# algorithm invariants under the race detector, and small production-path
# counterexamples. Cross-JDK and full historical-corpus checks remain manual.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  regression:
    name: Algorithm regression
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Reduce startup cost for small Java fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-java"
          # These short JVM processes exit before full JIT warmup pays off.
          # One CPU and serial GC avoid competing compiler/GC pools on the
          # runner. Original and rebuilt programs use the same options;
          # the fixtures, assertions, test set and individual deadlines stay unchanged.
          # CDS shares compiler class metadata, never fixture source or compiler results.
          printf 'final class Warmup {}\n' > "$RUNNER_TEMP/fixture-java/Warmup.java"
          javac -J-XX:TieredStopAtLevel=1 -J-XX:+UseSerialGC -J-XX:ActiveProcessorCount=1 \
            "-J-XX:ArchiveClassesAtExit=$RUNNER_TEMP/fixture-java/javac.jsa" \
            -proc:none -d "$RUNNER_TEMP/fixture-java" "$RUNNER_TEMP/fixture-java/Warmup.java"
          test -s "$RUNNER_TEMP/fixture-java/javac.jsa"
          printf '#!/bin/sh\nexec "%s" -J-XX:TieredStopAtLevel=1 -J-XX:+UseSerialGC -J-XX:ActiveProcessorCount=1 "-J-XX:SharedArchiveFile=%s" "$@"\n' "$(command -v javac)" "$RUNNER_TEMP/fixture-java/javac.jsa" > "$RUNNER_TEMP/fixture-java/javac"
          printf '#!/bin/sh\nexec "%s" -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -XX:ActiveProcessorCount=1 "$@"\n' "$(command -v java)" > "$RUNNER_TEMP/fixture-java/java"
          chmod +x "$RUNNER_TEMP/fixture-java/javac" "$RUNNER_TEMP/fixture-java/java"
          echo "$RUNNER_TEMP/fixture-java" >> "$GITHUB_PATH"
      - name: Build
        run: go build ./...
      - name: Core algorithm and resource-guard tests (race)
        run: go test ./classparser/decompiler/core/... ./classparser/decompiler/rewriter/... ./internal/workbudget ./internal/jdecenv -race -count=1 -timeout=3m
      - name: Source algorithm regression tests
        env:
          EDGE_TEST_PATTERN: '^Test(Native|CheckedEscape|CheckedConstructor|BindingPlan|CtorArrayThisSpillsRoundTrip|CtorArrayThisSpillPreservesEarlierArgumentOrder|CtorDelegationNestedArrayTempRoundTrip|CtorDelegationArgumentSpills|SuperDelegationTrailingArgumentSpills|SuperDelegationSpillAcrossSafePostSuperPrelude|ConditionalThisCtorCheckcastRoundTrip|TernaryCheckcastInvocationReceiverRoundTrip|CtorNPECheckBeforeThis|EnumArrayConstructorArgsRoundTrip|EnumClinit|ZxingEnum|GenericNull|GenericFieldElementOpsRoundTrip|GenericFunctionalValueKeepsErasedCallDescriptor|MaterializedBiFunctionErasureRoundTrip|SameClassBiFunctionTypeVariablesRoundTrip|SameClassFunctionAndSupplierErasureRoundTrip|SiblingClassFunctionalErasureRoundTrip|ChainedSiblingReturnFunctionalErasureRoundTrip|LowerBoundedFunctionalArgumentsRoundTrip|CapturedLowerBoundedFunctionalArgumentsRoundTrip|CapturedParameterizedLowerBoundRoundTrip|LambdaCaptureCopiesStayInsideGenericMethod|ClassCacheTernaryStoreRoundTrip|MapCacheTernaryLocalRoundTrip|ImmediateZeroArgCheckcastInvoke|NonConditionalForkDiamond|InheritedJDK|InvocationMetadata|JDKListNull|MemberLedger|MethodReferenceKeepsPolyTargetTypeRoundTrip|DirectoryStreamFilterKeepsInstantiatedMethodRefTypeRoundTrip|T04ExternalOverloadBindingRoundTrip|LogbackPutUninterruptibly|ProtobufRemainingReconstructs|ProtobufLazyStringArrayListThis|PublicSuffixDatabase|ThisCtorOverloadCast|GenericVarargsConstructorArrayRoundTrip|ShiftedThisCtorGenericArrayRoundTrip|ConditionalArrayCloneStoreRoundTrip|ToListSingleCallableCast|JacksonRemainingMapEntryDeserializerCast|JoinStreamCtorCast|RawGenericReceiver|SyntaxObservation|RetryRollback|ShadowBuilder|ShadowIRRunsFrameSSAAndLowering|T11_C01|Sentinels|Request|R06|T04|T05|T06|T07|T08|T18|T19|T27|TaskT20|TernaryCheckcastMergeRoundTrip|SelfCastNullMergeRoundTrip|ShortCircuitVarargsArraysRoundTrip|SharedFalseTargetFallthroughRoundTrip)'
        run: |
          set -o pipefail
          mkdir -p artifacts
          go test ./classparser -c -o "$RUNNER_TEMP/adversarial.test"
          # Edge cases and the adversarial corpus share the original 5+8 minute
          # source-regression budget within the unchanged fifteen-minute job.
          # Four isolated serial workers keep environment-changing tests safe.
          # Trusted fixtures use the same pool, avoiding a serial tail.
          # Every discovered test, mode and all forty fixtures remain selected.
          python3 - <<'PYTHON'
          import concurrent.futures, json, os, pathlib, re, shutil, signal, subprocess, sys, time
          binary = str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "adversarial.test")
          names = sorted(set(line for line in subprocess.check_output(
              [binary, "-test.list", "^TestAdversarial|" + os.environ["EDGE_TEST_PATTERN"]], text=True, cwd="classparser").splitlines()
              if line.startswith("Test")))
          if not names:
              raise SystemExit("no source-regression tests discovered")
          groups = [names[index::16] for index in range(min(16, len(names)))]
          # Concurrent evidence must not mutate the source fingerprint checked
          # while the trusted adapter is built and executed.
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "algorithm-regression-evidence"
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "adversarial-manifest.json").write_text(json.dumps(groups, indent=2))
          deadline = time.monotonic() + 13 * 60
          def run_batch(item):
              index, group = item
              trusted = group is None
              path = evidence / ("trusted-roundtrip.log" if trusted else f"adversarial-tests-{index+1}.jsonl")
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  path.write_text("phase deadline expired before batch started\n")
                  return path, 1
              command = ["go", "tool", "test2json", "-t", "-p",
                         "github.com/yaklang/javajive/classparser", binary,
                         "-test.v=test2json", "-test.count=1", "-test.parallel=1",
                         f"-test.timeout={remaining:.3f}s",
                         "-test.run=^(" + "|".join(map(re.escape, group or [])) + ")$"]
              if trusted:
                  command = ["bash", "-ec", 'git rev-parse HEAD > "$RUNNER_TEMP/algorithm-regression-evidence/revision.txt"; '
                             'python3 tools/curated_roundtrip/build_adapter.py --out "$RUNNER_TEMP/javajive-probe"; '
                             'python3 tools/curated_roundtrip/roundtrip.py --adapter "$RUNNER_TEMP/javajive-probe" '
                             '--out "$RUNNER_TEMP/algorithm-regression-evidence/roundtrip" --allow-trusted-fixture-execution --expected-rows 40']
              with path.open("w") as output:
                  process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                             cwd="." if trusted else "classparser", start_new_session=True)
                  try:
                      result = process.wait(timeout=max(0, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                      result = 1
              return path, result
          failed = False
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as workers:
              for path, result in workers.map(run_batch, [(-1, None)] + list(enumerate(groups))):
                  print(f"{path}: exit={result}")
                  if result:
                      failed = True
                      print("\n".join(path.read_text().splitlines()[-80:]))
          shutil.copytree(evidence, "artifacts", dirs_exist_ok=True)
          sys.exit(int(failed))
          PYTHON
      - name: Curated algorithm round-trip contracts
        run: python3 -m unittest tools.curated_roundtrip.test_roundtrip
      - name: Historical diagnostic-key regression
        run: python3 -m unittest ci.task_t30.test_t30_historical_diagnostics
      - name: Declaration metadata reader regression
        run: python3 -m unittest discover -s classparser -p test_jdk_metadata_catalog_generate.py
      - name: Roundtrip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: algorithm-regression-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
