# Required feedback is deliberately limited to reviewed Go algorithms and
# hash-pinned corpus inputs. Runtime/compiler behavior remains in manual gates.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
jobs:
  contract:
    name: Required inventory and build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/requiredci -check
      - run: CGO_ENABLED=0 go build ./...
      - run: go run ./tools/requiredci -run contract

  corpus:
    name: Fixed corpus regression
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/requiredci -run corpus

  algorithm:
    name: Go algorithm regression
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/requiredci -run algorithm

  dex:
    name: Go DEX regression
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/requiredci -run dex

  regression:
    name: Algorithm regression
    needs: [contract, corpus, algorithm, dex]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every reviewed gate
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          ALGORITHM_RESULT: ${{ needs.algorithm.result }}
          DEX_RESULT: ${{ needs.dex.result }}
        run: |
          test "$CONTRACT_RESULT" = success
          test "$CORPUS_RESULT" = success
          test "$ALGORITHM_RESULT" = success
          test "$DEX_RESULT" = success
