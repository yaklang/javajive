# Keep required PR feedback fast and attributable: one pinned JDK 21 runtime,
# algorithm invariants under the race detector, and small production-path
# counterexamples. Cross-JDK and full historical-corpus checks remain manual.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
jobs:
  regression:
    name: Algorithm regression
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Reduce startup cost for small Java fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-java"
          # These short JVM processes exit before full JIT warmup pays off.
          # One CPU and serial GC avoid competing compiler/GC pools on the
          # runner. Original and rebuilt programs use the same options;
          # the fixtures, assertions, test set and individual deadlines stay unchanged.
          # CDS shares compiler class metadata, never fixture source or compiler results.
          printf 'final class Warmup {}\n' > "$RUNNER_TEMP/fixture-java/Warmup.java"
          javac -J-XX:TieredStopAtLevel=1 -J-XX:+UseSerialGC -J-XX:ActiveProcessorCount=1 \
            "-J-XX:ArchiveClassesAtExit=$RUNNER_TEMP/fixture-java/javac.jsa" \
            -proc:none -d "$RUNNER_TEMP/fixture-java" "$RUNNER_TEMP/fixture-java/Warmup.java"
          test -s "$RUNNER_TEMP/fixture-java/javac.jsa"
          printf '#!/bin/sh\nexec "%s" -J-XX:TieredStopAtLevel=1 -J-XX:+UseSerialGC -J-XX:ActiveProcessorCount=1 "-J-XX:SharedArchiveFile=%s" "$@"\n' "$(command -v javac)" "$RUNNER_TEMP/fixture-java/javac.jsa" > "$RUNNER_TEMP/fixture-java/javac"
          printf '#!/bin/sh\nexec "%s" -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -XX:ActiveProcessorCount=1 "$@"\n' "$(command -v java)" > "$RUNNER_TEMP/fixture-java/java"
          chmod +x "$RUNNER_TEMP/fixture-java/javac" "$RUNNER_TEMP/fixture-java/java"
          echo "$RUNNER_TEMP/fixture-java" >> "$GITHUB_PATH"
      - name: Build
        run: go build ./...
      - name: Core algorithm and resource-guard tests (race)
        run: go test ./classparser/decompiler/core/... ./classparser/decompiler/rewriter/... ./internal/workbudget ./internal/jdecenv -race -count=1 -timeout=3m
      # Independent fixture JVMs each use one CPU; four fixtures can run concurrently.
      # Keep every selected test. Separate the growing adversarial corpus so
      # each bounded phase has useful failure evidence within the same bounded job.
      - name: Algorithm edge cases and source round-trip tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          go test ./classparser -run '^Test(BindingPlan|CtorArrayThisSpillsRoundTrip|CtorArrayThisSpillPreservesEarlierArgumentOrder|CtorDelegationNestedArrayTempRoundTrip|CtorDelegationArgumentSpills|SuperDelegationTrailingArgumentSpills|SuperDelegationSpillAcrossSafePostSuperPrelude|ConditionalThisCtorCheckcastRoundTrip|TernaryCheckcastInvocationReceiverRoundTrip|CtorNPECheckBeforeThis|EnumArrayConstructorArgsRoundTrip|EnumClinit|ZxingEnum|GenericNull|GenericFieldElementOpsRoundTrip|GenericFunctionalValueKeepsErasedCallDescriptor|MaterializedBiFunctionErasureRoundTrip|SameClassBiFunctionTypeVariablesRoundTrip|SameClassFunctionAndSupplierErasureRoundTrip|SiblingClassFunctionalErasureRoundTrip|ChainedSiblingReturnFunctionalErasureRoundTrip|LowerBoundedFunctionalArgumentsRoundTrip|CapturedLowerBoundedFunctionalArgumentsRoundTrip|CapturedParameterizedLowerBoundRoundTrip|LambdaCaptureCopiesStayInsideGenericMethod|ClassCacheTernaryStoreRoundTrip|MapCacheTernaryLocalRoundTrip|ImmediateZeroArgCheckcastInvoke|NonConditionalForkDiamond|InheritedJDK|InvocationMetadata|JDKListNull|MemberLedger|MethodReferenceKeepsPolyTargetTypeRoundTrip|DirectoryStreamFilterKeepsInstantiatedMethodRefTypeRoundTrip|T04ExternalOverloadBindingRoundTrip|LogbackPutUninterruptibly|ProtobufRemainingReconstructs|ProtobufLazyStringArrayListThis|PublicSuffixDatabase|ThisCtorOverloadCast|GenericVarargsConstructorArrayRoundTrip|ShiftedThisCtorGenericArrayRoundTrip|ConditionalArrayCloneStoreRoundTrip|ToListSingleCallableCast|JacksonRemainingMapEntryDeserializerCast|JoinStreamCtorCast|RawGenericReceiver|SyntaxObservation|RetryRollback|ShadowBuilder|ShadowIRRunsFrameSSAAndLowering|T11_C01|Sentinels|Request|R06|T04|T05|T06|T07|T08|T18|T19|T27|TaskT20|TernaryCheckcastMergeRoundTrip|SelfCastNullMergeRoundTrip|ShortCircuitVarargsArraysRoundTrip|SharedFalseTargetFallthroughRoundTrip)' -json -parallel=4 -count=1 -timeout=5m | tee artifacts/algorithm-tests.jsonl
      - name: Adversarial algorithm round-trip tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          go test ./classparser -run '^TestAdversarial' -json -parallel=4 -count=1 -timeout=8m | tee artifacts/adversarial-tests.jsonl
      - name: Curated algorithm round-trip contracts
        run: python3 -m unittest tools.curated_roundtrip.test_roundtrip
      - name: Historical diagnostic-key regression
        run: python3 -m unittest ci.task_t30.test_t30_historical_diagnostics
      - name: Declaration metadata reader regression
        run: python3 -m unittest discover -s classparser -p test_jdk_metadata_catalog_generate.py
      - name: Recompile and run trusted small Java fixtures
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/revision.txt
          python3 tools/curated_roundtrip/build_adapter.py --out "$RUNNER_TEMP/javajive-probe"
          python3 tools/curated_roundtrip/roundtrip.py --adapter "$RUNNER_TEMP/javajive-probe" --out artifacts/roundtrip --allow-trusted-fixture-execution --expected-rows 40
      - name: Roundtrip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: algorithm-regression-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
