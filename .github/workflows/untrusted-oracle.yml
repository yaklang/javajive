name: Untrusted oracle isolation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: untrusted-oracle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  t30-sandbox:
    name: T30 sandbox worker contracts
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK (Linux bind-mount fallback)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare pinned alpine image
        run: docker pull alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

      - name: Build trusted sandbox toolchain image
        run: docker build -t javajive-sandbox-toolchain:t30 -f tools/sandbox_worker/image/Dockerfile tools/sandbox_worker/image

      - name: Run T30 isolation contracts
        env:
          JAVAJIVE_SANDBOX_IMAGE: javajive-sandbox-toolchain:t30
        run: python3 -m unittest discover -s ci/task_t30 -p 'test_*.py' -v
